#ctl{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:none;justify-content:space-between;align-items:flex-end;padding:0 16px;pointer-events:none}

p{margin:6px 0;font-size:15px}.sm{font-size:12px;opacity:.75}

button.m.o{background:var(--ac);box-shadow:0 5px 0 #b33a1e}button.m.g{background:#8893aa;box-shadow:0 5px 0 #5d667a}

#nav{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);display:flex;justify-content:center;gap:8px;pointer-events:auto}

.gh{display:flex;align-items:center;justify-content:space-between;gap:6px}.gh h2{margin:0}.gh .m{padding:4px 14px;margin:0}

.sw{width:22px;height:22px;border-radius:50%;display:inline-block;vertical-align:middle;margin-right:6px}
#lg{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;font:inherit;font-weight:800;font-size:15px;border:0;border-radius:99px;padding:7px 14px;background:var(--card);color:var(--ink);box-shadow:0 4px 12px rgba(0,0,0,.25);pointer-events:auto}

function hidePreview(){if(showCar){scene.remove(showCar.g);showCar=null}if(plat)plat.visible=false}
function quitRace(){race='menu';['hud','gauge','ctl'].forEach(i=>$(i).style.display='none');cars.forEach(c=>scene.remove(c.g));proj.forEach(p=>scene.remove(p.m));proj=[];cars=[];$('msg').textContent='';if(multiOn&&rm)rm.presence({x:null,fn:0});multiOn=false}
function go(d){if(race!=='menu')quitRace();if(d==='h')home();else if(d==='g')garage();else if(d==='u')upgrades();else if(rm)lobby();else levels()}
function pause(){if(race!=='race'&&race!=='count')return;tab='';
 if(multiOn){show('<h2>Leave the race?</h2><button class="m g" onclick="$(\'ov\').style.display=\'none\'">Keep racing</button><button class="m o" onclick="go(\'p\')">Back to lobby</button>');return}
 pausedFrom=race;race='paused';show('<h2>Paused</h2><button class="m o" onclick="resume()">Resume</button><br><button class="m" onclick="startRace('+curLv+')">Restart</button><button class="m g" onclick="go(\'h\')">Home</button>')}
function resume(){$('ov').style.display='none';race=pausedFrom}
$('pz').addEventListener('pointerdown',e=>{e.stopPropagation();pause()});
function finish(){race='done';sfx('win');const place=Pl.place,L=curLv,t=Pl.ft,rw=(300+[400,280,200,120,60,30][Math.min(5,place-1)]*(1+L*.2))|0;
 let mok=0,mb=0;if(!multiOn&&mission){mok=mission.t==='place'?place<=mission.v:mission.t==='coins'?Pl.coins>=mission.v:t<=mission.v;if(mok){mb=save.done[L]?80:400;save.done[L]=1}}
 const nb=save.best[L]==null||t<save.best[L];if(nb)save.best[L]=+t.toFixed(2);save.top[L]=(save.top[L]||[]).concat([+t.toFixed(2)]).sort((a,b)=>a-b).slice(0,5);
 save.coins+=rw+mb;if(!multiOn&&place<=3&&L+1<LV.length&&save.unlocked<L+2)save.unlocked=L+2;persist();submit();const ms=mission,cc=Pl.coins;
 setTimeout(()=>{const mp=multiOn;race='menu';tab='';['hud','gauge','ctl'].forEach(i=>$(i).style.display='none');
  show('<h2>'+(place===1?'🏆 You won!':'Finished '+place+'/'+cars.length)+'</h2><p>Time '+fmt(t)+(nb?' · new best!':'')+'</p><p>🪙 +'+rw+' coins</p>'+(cc?'<p class="sm">+'+cc*5+' coins collected on the road</p>':'')+(ms&&!mp?'<p>'+(mok?'✅ Mission complete! +'+mb+' coins':'❌ '+mtxt(ms))+'</p>':'')+(mp?'<button class="m o" onclick="backLobby()">Back to lobby</button>':'<button class="m o" onclick="startRace('+L+')">Race again</button>'+(L+1<LV.length&&save.unlocked>L+1?'<button class="m" onclick="startRace('+(L+1)+')">Next world</button>':''))+'<br><button class="m g" onclick="'+(mp?'leave()':'home()')+'">Menu</button>')},1500)}
let db=null,user=null,uid=null,lbDocs=[],grp={code:'',host:0,w:0,sn:0},lastSt=0,joinedAt=0;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function home(){tab='h';lobbyOn=0;previewCar(save.car);const c=CARS[save.car];
 show('<h1>Turbo Rush</h1><p class="sm">Race, crash, grab 🎁, earn coins, buy new cars.</p><input id="nm" maxlength="14" placeholder="Your racer name" value="'+esc(save.name||'')+'"><div><button class="m o" onclick="nm();levels()">Solo race</button><button class="m" onclick="nm();groupMenu()">Play with friends</button></div><p class="sm">🚗 '+c.n+' · 🪙'+save.coins+'</p><p class="sm">'+(uid?'Signed in – your times go on the global leaderboard.':'Open in claude.ai to use the global leaderboard. Progress is saved on this device.')+'</p><button class="m g" onclick="nm();board(0)">Leaderboard</button>',true)}
const nm=()=>{const v=$('nm');if(v){save.name=v.value.trim().slice(0,14);persist()}};
function levels(){tab='p';show('<h2>Choose world</h2>'+LV.map((l,i)=>i<save.unlocked?'<div class="row"><span><b>'+(i+1)+'. '+l.n+'</b><br><span class="sm">One lap · best '+fmt(save.best[i])+'</span><br><span class="sm">'+(save.done[i]?'✅ ':'')+mdesc(i)+'</span></span><button class="m o" onclick="startRace('+i+')">Go</button></div>':'<div class="row"><span>🔒 '+(i+1)+'. '+l.n+'</span><span class="sm">top 3 on the last world</span></div>').join('')+'<button class="m g" onclick="home()">Back</button>')}
function garage(i){tab='g';if(i==null||i!==i)i=save.car;gsel=(i+CARS.length)%CARS.length;const c=CARS[gsel],t=c.s,own=save.own.includes(gsel);previewCar(gsel);
 const bar=(l,v,mx)=>'<div class="st"><span>'+l+'</span><i><b style="width:'+Math.min(100,v/mx*100)+'%"></b></i></div>';
 show('<div class="gh"><button class="m g" onclick="garage('+(gsel-1)+')">◀</button><h2>'+c.n+' <span class="sm">'+(gsel+1)+'/'+CARS.length+'</span></h2><button class="m g" onclick="garage('+(gsel+1)+')">▶</button></div><p class="sm">'+c.d+'</p>'+bar('Speed',t.sp,1.7)+bar('Accel',t.ac,1.6)+bar('Handling',t.hd,1.7)+bar('Weight',t.m,3)+
  '<p>'+(save.car===gsel?'✅ Your car':own?'Owned':'🪙 '+c.p)+' <span class="sm">· you have 🪙'+save.coins+'</span></p>'+(save.car===gsel?'':own?'<button class="m o" onclick="pickCar('+gsel+')">Use this car</button>':'<button class="m o" onclick="pickCar('+gsel+')">Buy for 🪙'+c.p+'</button>'),true)}
const UPN=[['sp','Top speed','⚡'],['ac','Acceleration','🚀'],['hd','Grip','🎯'],['sh','Shield','🛡']],upCost=l=>Math.round(120*Math.pow(1.7,l));
function upgrades(){tab='u';show('<h2>Upgrades</h2><p class="sm">Applies to every car · you have 🪙'+save.coins+'</p>'+UPN.map(([k,n,ic])=>{const l=save.up[k];return'<div class="row"><span>'+ic+' <b>'+n+'</b><br><span class="sm">'+'●'.repeat(l)+'○'.repeat(5-l)+'</span></span>'+(l>=5?'<b>MAX</b>':'<button class="m o" onclick="buyUp(\''+k+'\')">🪙'+upCost(l)+'</button>')+'</div>'}).join('')+'<p class="sm">Shield: longer shield power-up and a free shield at the start of every race.</p>')}
function buyUp(k){const l=save.up[k],c=upCost(l);if(l>=5)return;if(save.coins<c){toast('Not enough coins');sfx('crash');return}save.coins-=c;save.up[k]=l+1;persist();sfx('gift');upgrades()}
function pickCar(i){if(!save.own.includes(i)){if(save.coins<CARS[i].p){toast('Not enough coins');return}save.coins-=CARS[i].p;save.own.push(i)}save.car=i;persist();if(rm)rm.presence({car:i});garage(i)}

// ---- groups: claude.ai room if available, otherwise a public MQTT relay so it also works on GitHub Pages
function mqttRoom(code,host){return new Promise((res,rej)=>{
 const B=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081'];
 const id=Math.random().toString(36).slice(2,10),topic='turborush1/'+code+'/',st={},seen={},mine={},cbs=[];let cl=null,pt=0,done=0,bi=0,timer=0;
 const fire=()=>cbs.forEach(f=>f()),pub=()=>{if(cl&&cl.connected)cl.publish(topic+id,JSON.stringify(mine))};
 const room={presence(p){Object.assign(mine,p);if(!pt)pt=setTimeout(()=>{pt=0;pub()},50);return Promise.resolve()},
  peers(){return[id,...Object.keys(st).sort()].map(k=>({peer:k,isMe:k===id,presence:k===id?mine:st[k]}))},
  onPeers(f){cbs.push(f)},leave(){clearInterval(timer);try{cl.publish(topic+id,'{"gone":1}');cl.end(true)}catch(e){}}};
 const conn=()=>{if(bi>=B.length){if(!done){done=1;rej('nobroker')}return}
  const c=mqtt.connect(B[bi++],{connectTimeout:6000,reconnectPeriod:0,clean:true,will:{topic:topic+id,payload:'{"gone":1}'}});cl=c;let ok=0,tried=0;
  const next=()=>{if(!ok&&!tried&&!done){tried=1;try{c.end(true)}catch(e){}conn()}};
  c.on('connect',()=>{ok=1;c.subscribe(topic+'+',err=>{if(err){ok=0;next();return}
   timer=setInterval(()=>{pub();const n=Date.now();Object.keys(seen).forEach(k=>{if(n-seen[k]>6000){delete st[k];delete seen[k];fire()}})},1000);
   if(host){done=1;res(room)}else{const t0=Date.now(),w=setInterval(()=>{if(Object.values(st).some(p=>p&&p.h===1)){clearInterval(w);done=1;res(room)}else if(Date.now()-t0>5000){clearInterval(w);done=1;clearInterval(timer);c.end(true);rej('nogroup')}},200)}})});
  c.on('message',(tp,pl)=>{const k=tp.slice(topic.length);if(k===id)return;try{const m=JSON.parse(pl.toString());if(m.gone){delete st[k];delete seen[k]}else{st[k]=m;seen[k]=Date.now()}fire()}catch(e){}});
  c.on('error',next);c.on('close',next);setTimeout(next,7000)};
 conn()})}
function groupMenu(){tab='p';show('<h2>Play with friends</h2>'+(ROOM||window.mqtt?'<p class="sm">Share the game link and the code with your friends.</p><button class="m o" onclick="mkGroup()">Create group</button><p>or enter a code</p><input id="cd" maxlength="4" placeholder="CODE" style="text-transform:uppercase;width:50%"><br><button class="m" onclick="joinCode()">Join</button>':'<p>Group play is not available here.</p>')+'<br><button class="m g" onclick="home()">Back</button>')}
const mkGroup=()=>joinGroup(Array.from({length:4},()=>'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[Math.random()*31|0]).join(''),1);
function joinCode(){const c=($('cd').value||'').trim().toUpperCase();if(c.length!==4){toast('Enter the 4-letter code');return}joinGroup(c,0)}
async function joinGroup(code,host){try{rm=ROOM?await ROOM.join('tr-'+code):await mqttRoom(code,host)}catch(e){rm=null;console.warn('group',e);toast(e==='nogroup'?'Group not found':host?'Could not create':'Could not join');return}
 grp={code,host,w:0,sn:0};lastSt=0;joinedAt=Date.now();multiOn=false;
 await rm.presence({n:save.name||'Racer',car:save.car,h:host?1:0,w:0,st:0,x:null,fn:0});rm.onPeers(onPeers);lobbyOn=1;lobby()}
const hostW=()=>{const h=rm.peers().find(p=>p.presence&&p.presence.h===1);return h?(h.presence.w|0):0};
function lobby(){if(!rm)return;tab='p';lobbyOn=1;const ps=rm.peers().filter(p=>p.presence&&p.presence.n),w=grp.host?grp.w:hostW();
 show('<h2>Group '+grp.code+'</h2><p class="sm">Share this code with friends</p>'+ps.map(p=>'<div class="row"><span><i class="sw" style="background:#'+hex((CARS[p.presence.car|0]||CARS[0]).c)+'"></i>'+esc(p.presence.n||'Racer')+(p.presence.h?' 👑':'')+(p.isMe?' (you)':'')+'</span></div>').join('')+
 (grp.host?'<p>Pick the world:</p>'+LV.map((l,i)=>'<button class="m '+(i===w?'':'g')+'" style="padding:4px 12px;font-size:15px" onclick="setW('+i+')">'+(i+1)+'</button>').join('')+'<p class="sm">'+LV[w].n+'</p><button class="m o" onclick="hostStart()">Start race</button>':'<p>World: <b>'+LV[w].n+'</b></p><p class="sm">Waiting for the host to start…</p>')+'<br><button class="m g" onclick="leave()">Leave group</button>')}
function setW(i){grp.w=i;rm.presence({w:i});lobby()}
function hostStart(){grp.sn++;lastSt=grp.sn;rm.presence({w:grp.w,st:grp.sn});startRace(grp.w,true)}
function onPeers(){if(!rm)return;if(lobbyOn&&race==='menu')lobby();const h=rm.peers().find(p=>p.presence&&p.presence.h===1&&!p.isMe);
 if(h){const st=h.presence.st|0;if(st>lastSt){lastSt=st;if(Date.now()-joinedAt>2000&&race==='menu')startRace(h.presence.w|0,true)}}}
function backLobby(){if(rm)rm.presence({x:null,fn:0,rk:null});multiOn=false;lobby()}
function leave(){try{rm.presence({n:null,x:null,h:0});rm.leave()}catch(e){}rm=null;lobbyOn=0;multiOn=false;home()}
async function board(l){tab='';let rows=[];
 if(db){const ids=lbDocs.filter(d=>d.t&&d.t[l]!=null).sort((a,b)=>a.t[l]-b.t[l]).slice(0,10);let pr={};try{pr=await user.profiles(ids.map(d=>d.id))}catch(e){}
  rows=ids.map((d,i)=>'<div class="row"><span>'+(i+1)+'. '+esc(d.nick||(pr[d.id]&&pr[d.id].name)||'Racer')+(d.id===uid?' (you)':'')+'</span><b>'+fmt(d.t[l])+'</b></div>')}
 else rows=(save.top[l]||[]).map((t,i)=>'<div class="row"><span>'+(i+1)+'. '+esc(save.name||'You')+' (you)</span><b>'+fmt(t)+'</b></div>');
 show('<h2>Leaderboard</h2><p>'+LV.map((_,i)=>'<button class="m '+(i===l?'':'g')+'" style="padding:4px 12px;font-size:15px" onclick="board('+i+')">'+(i+1)+'</button>').join('')+'</p><p class="sm">'+LV[l].n+(db?'':' · local only')+'</p>'+(rows.join('')||'<p>No times yet – go set one!</p>')+'<button class="m g" onclick="home()">Back</button>')}
function submit(){if(db&&uid)db.collection('scores').doc(uid).set({nick:save.name||'Racer',t:save.best}).catch(()=>{})}
(async()=>{if(!window.claude)return;const to=p=>Promise.race([p,new Promise(r=>setTimeout(()=>r(null),4000))]);
 try{ROOM=await to(claude.use('room'))}catch(e){}
 try{user=await to(claude.use('user'));db=await to(claude.use('db'));
  if(user&&db){uid=await user.id();if(!uid){db=null}else{if(!save.name){const me=await user.me();if(me&&me.name){save.name=me.name.slice(0,14);persist()}}
   db.collection('scores').onSnapshot(s=>{lbDocs=s.docs.map(d=>Object.assign({id:d.id},d.data()))},()=>{})}}else db=null}catch(e){db=null}
 if(race==='menu'&&!lobbyOn&&$('nm'))home()})();

// ---- loop
build(LV[0]);cars=[];
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-lastT)/1000);lastT=now;partsUpd(dt);boomUpd(dt);coinT.offset.x=(Math.floor(perf*12)%8)/8;coinT2.offset.x=((Math.floor(perf*12)+4)%8)/8;
 {const act=Pl&&(race==='race'||race==='count'||race==='done');engUpd(act?Pl.v:0,act&&Pl.boost>0,act);drawFx(act?Pl.v:0,act&&Pl.boost>0,dt)}
 if(race==='paused'){}else if(race!=='menu')step(dt);else{perf+=dt;const a=perf*.12;boxes.forEach(b=>b.g.rotation.y+=dt);if(cloudsM)cloudsM.rotation.y+=dt*.004;
  if(gview){const b=perf*.5;cam.position.set(Math.sin(b)*10.5,3.4,Math.cos(b)*10.5);cam.lookAt(0,1,0);cam.fov=48;sun.position.set(SUNV.x*80,SUNV.y*80+10,SUNV.z*80);sun.target.position.set(0,0,0)}
  else{cam.position.set(Math.sin(a)*330,110,Math.cos(a)*330);cam.lookAt(0,0,0);cam.fov=62}cam.updateProjectionMatrix()}
 dome.position.copy(cam.position);starsM.position.copy(cam.position);sunD.position.copy(cam.position).addScaledVector(SUNV,1100);
 if(comp)comp.render();else ren.render(scene,cam)}
applyLang();muteLabels();home();requestAnimationFrame(loop);
